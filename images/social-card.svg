  <!-- solid background (social cards must not be transparent) -->
  <rect width="1280" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1280" height="640" fill="none"/>

  <!-- icon: {{  egg  }} -->
  <g transform="translate(310,-40) scale(3)">
