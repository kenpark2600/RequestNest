      <path d="M74,52 C62,52 62,66 62,76 C62,86 52,90 42,90 C52,90 62,94 62,104 C62,114 62,128 74,128"/>
      <path d="M92,52 C80,52 80,66 80,76 C80,86 70,90 60,90 C70,90 80,94 80,104 C80,114 80,128 92,128"/>
      <path d="M128,52 C140,52 140,66 140,76 C140,86 150,90 160,90 C150,90 140,94 140,104 C140,114 140,128 128,128"/>
      <path d="M146,52 C158,52 158,66 158,76 C158,86 168,90 178,90 C168,90 158,94 158,104 C158,114 158,128 146,128"/>
