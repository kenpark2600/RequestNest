site_name: RequestNest
site_description: Free team sharing of Postman collections and environments using git — keep Postman, skip the per-seat cost, with secrets sanitized automatically.
site_url: https://requestnest.dev
repo_url: https://github.com/kenpark2600/RequestNest
repo_name: kenpark2600/RequestNest
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

copyright: >
  RequestNest is an independent open-source project, not affiliated with,
  endorsed by, or sponsored by Postman, Inc. "Postman" is a trademark of its
  respective owner, used here only to describe interoperability.

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Project brief: project-brief.md
  - Market analysis: market-analysis.md
  - Manual test checklist: manual-test-checklist.md
  - Publishing: publishing.md
